<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>워터마크 카메라</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen justify-between">

    <!-- 상단 입력 영역 -->
    <div class="p-4 bg-gray-800 space-y-2">
        <div class="flex gap-2">
            <input type="text" id="inputDate" placeholder="날짜 (예: 2026-06-07)" class="flex-1 bg-gray-700 text-white px-3 py-2 rounded text-sm focus:outline-none">
            <input type="text" id="inputDong" placeholder="동 (예: 101동)" class="w-1/3 bg-gray-700 text-white px-3 py-2 rounded text-sm focus:outline-none">
            <input type="text" id="inputFloor" placeholder="층 (예: 5층)" class="w-1/3 bg-gray-700 text-white px-3 py-2 rounded text-sm focus:outline-none">
        </div>
    </div>

    <!-- 카메라 뷰파인더 영역 -->
    <div class="relative flex-1 flex items-center justify-center overflow-hidden bg-black">
        <video id="video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
        <!-- 화면에 실시간으로 보여주는 오버레이 워터마크 -->
        <div id="watermarkPreview" class="absolute bottom-4 left-4 bg-black/60 text-white px-3 py-2 rounded-lg text-xs backdrop-blur-sm pointer-events-none space-y-0.5">
            <div id="prevDate"></div>
            <div id="prevLocation"></div>
        </div>
    </div>

    <!-- 촬영 버튼 영역 -->
    <div class="p-6 bg-gray-800 flex justify-center items-center">
        <button id="captureBtn" class="w-16 h-16 bg-white rounded-full border-4 border-gray-400 active:scale-95 transition"></button>
    </div>

    <!-- 캡처용 숨겨진 캔버스 -->
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('video');
        const inputDate = document.getElementById('inputDate');
        const inputDong = document.getElementById('inputDong');
        const inputFloor = document.getElementById('inputFloor');
        
        const prevDate = document.getElementById('prevDate');
        const prevLocation = document.getElementById('prevLocation');
        const captureBtn = document.getElementById('captureBtn');
        const canvas = document.getElementById('canvas');

        // 기본 날짜 오늘 날짜로 세팅
        const today = new Date().toISOString().split('T')[0];
        inputDate.value = today;

        // 카메라 실행
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert('카메라 권한이 거부되었거나 사용할 수 없습니다. 브라우저 설정에서 카메라 권한을 허용해 주세요.');
                console.error(err);
            }
        }

        // 실시간 미리보기 텍스트 업데이트
        function updatePreview() {
            prevDate.textContent = inputDate.value;
            const dongText = inputDong.value ? `${inputDong.value} ` : '';
            const floorText = inputFloor.value ? `${inputFloor.value}` : '';
            prevLocation.textContent = `${dongText}${floorText}`.trim();
        }

        inputDate.addEventListener('input', updatePreview);
        inputDong.addEventListener('input', updatePreview);
        inputFloor.addEventListener('input', updatePreview);
        updatePreview();

        // 사진 촬영 및 워터마크 합성
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // 1. 비디오 프레임 캔버스에 그리기
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. 워터마크 텍스트 조합
            const dateStr = inputDate.value;
            const dongStr = inputDong.value;
            const floorStr = inputFloor.value;
            const locationStr = [dongStr, floorStr].filter(Boolean).join(' ');

            if (dateStr || locationStr) {
                // 스타일 설정 (고해상도 기준 크기 조절)
                const fontSize = Math.max(canvas.width * 0.035, 20);
                ctx.font = `bold ${fontSize}px sans-serif`;
                
                // 텍스트 패딩 및 위치 계산 (왼쪽 아래)
                const padding = fontSize * 0.8;
                const x = padding;
                const lines = [dateStr, locationStr].filter(Boolean);
                
                let boxHeight = lines.length * (fontSize * 1.3) + padding;
                let maxWidth = 0;
                lines.forEach(line => {
                    const metrics = ctx.measureText(line);
                    if (metrics.width > maxWidth) maxWidth = metrics.width;
                });
                let boxWidth = maxWidth + padding * 2;
                let y = canvas.height - boxHeight - padding;

                // 반투명 배경 박스 그리기
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.beginPath();
                ctx.roundRect(x, y, boxWidth, boxHeight, 12);
                ctx.fill();

                // 텍스트 그리기
                ctx.fillStyle = '#ffffff';
                let textY = y + padding + (fontSize * 0.8);
                lines.forEach(line => {
                    ctx.fillText(line, x + padding, textY);
                    textY += fontSize * 1.3;
                });
            }

            // 3. 이미지 다운로드 링크 생성
            const link = document.createElement('a');
            link.download = `watermark_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        });

        initCamera();
    </script>
</body>
</html>
